<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="300" viewBox="0 0 1140 300" role="img" aria-labelledby="title desc">
<title id="title">QueueFlow CI/CD process</title><desc id="desc">Push or Pull Request triggers build, test, deploy, health-check and rollback on failure.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#6d829d"/></marker></defs>
<rect width="1140" height="300" rx="18" fill="#f6f9fc"/>
<text x="36" y="43" fill="#132944" font-size="24" font-family="Arial" font-weight="700">QueueFlow / CI-CD workflow</text>
<g font-family="Arial" font-size="17" font-weight="700" text-anchor="middle">
<rect x="38" y="101" width="185" height="85" rx="14" fill="#e5ecf7" stroke="#c3d2e3"/><text x="130" y="134" fill="#1e3b5e">Git push / PR</text><text x="130" y="157" fill="#5a718c" font-size="12" font-weight="400">main + dev</text>
<rect x="270" y="101" width="185" height="85" rx="14" fill="#e7f4fd" stroke="#b8dcf2"/><text x="362" y="134" fill="#1b5880">01 · Build</text><text x="362" y="157" fill="#5a718c" font-size="12" font-weight="400">Compile Java + JAR</text>
<rect x="502" y="101" width="185" height="85" rx="14" fill="#e9f6f0" stroke="#b3dfc9"/><text x="595" y="134" fill="#187a58">02 · Test</text><text x="595" y="157" fill="#5a718c" font-size="12" font-weight="400">31 automated checks</text>
<rect x="734" y="101" width="185" height="85" rx="14" fill="#e9f6f0" stroke="#b3dfc9"/><text x="826" y="134" fill="#187a58">03 · Deploy</text><text x="826" y="157" fill="#5a718c" font-size="12" font-weight="400">Blue / Green switch</text>
<rect x="961" y="101" width="146" height="85" rx="14" fill="#edf9f6" stroke="#b4e2d6"/><text x="1034" y="134" fill="#177c6f">Health check</text><text x="1034" y="157" fill="#5a718c" font-size="12" font-weight="400">HTTP 200 + log</text>
</g>
<g fill="none" stroke="#6d829d" stroke-width="2.5" marker-end="url(#arrow)"><path d="M223 144 H260"/><path d="M455 144 H492"/><path d="M687 144 H724"/><path d="M919 144 H950"/></g>
<path d="M1035 186 V231 H824 V186" stroke="#d46c6c" stroke-width="2.5" fill="none" stroke-dasharray="7 4"/>
<rect x="719" y="229" width="218" height="49" rx="12" fill="#fff1f1" stroke="#f0cccc"/>
<text x="828" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#bb5353" font-family="Arial">Failed? Rollback</text>
<text x="828" y="266" text-anchor="middle" font-size="11" fill="#bb7373" font-family="Arial">Keep previous release active</text>
</svg>